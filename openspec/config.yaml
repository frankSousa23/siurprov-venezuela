schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: SIURPROV - Simulador Urbano de Proyección para Venezuela.
  Stack: React 19 + Vite 8 + TypeScript + Tailwind 4, servidor Express (server.ts, puerto 3000).
  Dominio: ingeniería sismorresistente (COVENIN 1756), geotecnia, multi-amenaza, datos MapBiomas.
  Principios: solo software de código abierto (MIT/Apache/BSD), offline-first, sin servicios de pago.
  Licencia: MIT estándar; la mención al autor es solo una cortesía, no una condición.
  Pruebas: `npm test` (física, seguridad, integridad) y `npm run lint` (tsc) deben pasar.
  3D: Three.js + @react-three/fiber + drei (carga perezosa).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
